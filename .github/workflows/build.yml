name: Build

on:
    push:
        branches: [ main ]
        tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
    unit-tests:
        name: "Unit tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Run unit tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 CodeCoverage
            -   name: Run unit tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh CodeCoverage
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: ${{ runner.os }}-artifacts
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    static-code-analysis:
        name: "Static code analysis"
        runs-on: ubuntu-latest
        env:
            REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Run sonarcloud analysis
                run: ./build.sh CodeAnalysis
    
    publish-test-results:
        name: "Publish Tests Results"
        needs: [ unit-tests ]
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        if: always()
        steps:
            -   name: Download Artifacts
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    path: artifacts
            -   name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
                with:
                    comment_mode: always
                    files: "artifacts/**/**/*.trx"
    
    pack:
        name: "Pack"
        runs-on: ubuntu-latest
        needs: [ publish-test-results, static-code-analysis ]
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.3xx
            -   name: Pack nuget packages
                run: ./build.sh Pack
            -   name: Upload packages
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    path: Artifacts/Packages
                    name: Packages
    
    push:
        name: "Push"
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        runs-on: macos-latest
        environment: production
        needs: [ pack ]
        permissions:
            contents: write
        steps:
            -   name: Download packages
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: Packages
                    path: Artifacts/Packages
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
            -   name: Publish
                run: |
                    echo "Found the following packages to push:"
                    search_dir=Artifacts/Packages
                    for entry in Artifacts/Packages/*.nupkg
                    do
                      echo "- $entry"
                    done
                    for entry in Artifacts/Packages/*.nupkg
                    do
                      dotnet nuget push $entry --source https://api.nuget.org/v3/index.json --api-key "${{secrets.NUGET_API_KEY}}" --skip-duplicate
                    done
            -   name: Check pre-release
                id: check-pre-release
                run: |
                    if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "release=true" >> $GITHUB_OUTPUT
                    fi
            -   name: Create GitHub release
                if: steps.check-pre-release.outputs.release == 'true'
                continue-on-error: true
                uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
                with:
                    name: ${{ steps.tag.outputs.release_version }}
                    tag_name: ${{ steps.tag.outputs.release_version }}
                    token: ${{ secrets.GITHUB_TOKEN }}
                    generate_release_notes: true
    
    finalize-release:
        name: "Finalize release"
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        needs: [ push ]
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            -   name: Check pre-release
                id: check-pre-release
                run: |
                    if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "release=true" >> $GITHUB_OUTPUT
                    fi
            -   name: Comment relevant issues and pull requests
                if: steps.check-pre-release.outputs.release == 'true'
                continue-on-error: true
                uses: apexskier/github-release-commenter@e7813a9625eabd79a875b4bc4046cfcae377ab34 # v1.4.1
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    comment-template: |
                        This is addressed in release {release_link}.
                    label-template: |
                        state: released
                    skip-label: |
                        state: released
